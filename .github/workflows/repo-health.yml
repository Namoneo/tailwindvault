name: Repo Health

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repository info
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Last commit:"
          git log -1 --oneline

      - name: Root files
        run: ls -la

      - name: Source structure
        run: |
          echo "=== Source folders ==="
          find . -maxdepth 3 -type d \( -name "src" -o -name "lib" -o -name "app" -o -name "packages" \) 2>/dev/null | head -10
          echo "=== Config files ==="
          ls *.json *.yaml *.yml 2>/dev/null || echo "None in root"
