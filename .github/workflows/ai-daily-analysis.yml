name: AI Daily Analysis

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run analysis
        run: |
          echo "=== Daily AI Analysis ==="
          echo "Repository: ${{ github.repository }}"
          echo "Triggered: $(date)"
          echo ""
          echo "=== Git status ==="
          git status --short
          echo ""
          echo "=== Last commit ==="
          git log -1 --oneline --stat
          echo ""
          echo "=== Package manifests ==="
          find . -maxdepth 2 \( -name "package.json" -o -name "pyproject.toml" -o -name "go.mod" \) -exec echo "--- {}" \; -exec cat {} \; 2>/dev/null | head -50
          echo ""
          echo "=== Open issues count ==="
          echo "Hook OpenClaw runtime here for full AI analysis"
